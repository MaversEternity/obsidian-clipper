<!DOCTYPE html>
<html>
	<head>
		<title>Book Viewer</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="pdf_viewer.css">
		<link rel="stylesheet" href="reader.css" id="obsidian-reader-styles">
		<link rel="stylesheet" href="book-viewer-style.css">
		<script src="browser-polyfill.min.js"></script>
	</head>
	<body style="margin:0;overflow:hidden;height:100vh;display:flex;flex-direction:column">
		<div id="toolbar">
			<button id="open-file-btn" title="Open file">
				<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>
				Open PDF
			</button>
			<div id="page-controls">
				<button id="prev-page" title="Previous page" disabled>
					<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
				</button>
				<span id="page-info">No file loaded</span>
				<button id="next-page" title="Next page" disabled>
					<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
				</button>
			</div>
			<div id="zoom-controls">
				<button id="zoom-out" title="Zoom out">
					<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
				</button>
				<span id="zoom-level">100%</span>
				<button id="zoom-in" title="Zoom in">
					<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
				</button>
				<button id="zoom-fit" title="Fit to width">Fit</button>
			</div>
			<span id="file-name"></span>
		</div>
		<div id="viewer-container">
			<div id="viewer" class="pdfViewer"></div>
		</div>
		<input type="file" id="file-input" accept=".pdf" style="display: none;">
		<script type="module" src="book-viewer.js"></script>
	</body>
</html>
